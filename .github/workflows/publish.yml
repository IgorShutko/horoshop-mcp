name: Publish

# Runs on a published GitHub release: pushes the package to npm, then registers
# that version in the official MCP registry. Needs one repository secret:
# NPM_TOKEN (npm > Access Tokens > Granular, publish rights on horoshop-mcp-server).
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check the publish token is configured
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN secret is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  registry:
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC proves this repo owns io.github.igorshutko/*
    steps:
      - uses: actions/checkout@v7
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
