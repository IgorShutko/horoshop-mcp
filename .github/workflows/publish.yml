name: Publish

# On a published release: build the .mcpb bundle, attach it to the release, then
# register that version in the official MCP registry (GitHub OIDC - no secret).
# The npm job is optional: it runs only when an NPM_TOKEN secret exists, because
# the package name is published from an account this workflow does not own yet.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the asset to the release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/check-version.mjs
      - run: node scripts/build-mcpb.mjs
      - name: Attach the bundle to the release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" build/horoshop-mcp.mcpb --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: horoshop-mcp-mcpb
          path: build/horoshop-mcp.mcpb

  registry:
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC proves this repo owns io.github.igorshutko/*
    steps:
      - uses: actions/checkout@v7
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
      # The registry verifies the bundle by hash, and the hash is only known once
      # the asset is on the release - so it is pinned here, not committed.
      - name: Pin the bundle hash into server.json
        run: |
          url=$(node -p "require('./server.json').packages.find(p => p.registryType === 'mcpb').identifier")
          curl -fsSL --retry 5 --retry-all-errors -o bundle.mcpb "$url"
          sha=$(sha256sum bundle.mcpb | cut -d' ' -f1)
          node -e '
            const fs = require("fs");
            const s = JSON.parse(fs.readFileSync("server.json", "utf8"));
            s.packages.find((p) => p.registryType === "mcpb").fileSha256 = process.argv[1];
            fs.writeFileSync("server.json", JSON.stringify(s, null, 2) + "\n");
          ' "$sha"
          echo "bundle sha256: $sha"
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish

  npm:
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Publish if a token is configured
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::notice::NPM_TOKEN is not set - skipping npm. The bundle and the registry entry are published either way."
            exit 0
          fi
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
