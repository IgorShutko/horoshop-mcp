name: Site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/tools.json"
      - "llms.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The page prints tool counts from docs/tools.json, so it is built, not committed.
      - run: node site/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/_site
      - id: deploy
        uses: actions/deploy-pages@v4
